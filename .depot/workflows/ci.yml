name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ruby 4.0.7, PostgreSQL 17
    runs-on: depot-ubuntu-24.04-4
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: decent_job_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DECENT_JOB_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/decent_job_test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.7'
          bundler-cache: true
      - run: bundle exec standardrb
      - run: bundle exec rake spec
      # The runner ships pg_dump 16, which refuses a PostgreSQL 17 server.
      - run: sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y && sudo apt-get install -y pgbouncer postgresql-client-17
      - run: bundle exec rake spec:pgbouncer
      - run: gem build decent_job.gemspec
      - run: bundle install
        env:
          BUNDLE_GEMFILE: gemfiles/rails.gemfile
      - run: bundle exec rake spec:rails
        env:
          BUNDLE_GEMFILE: gemfiles/rails.gemfile
