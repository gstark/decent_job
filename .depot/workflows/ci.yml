# Depot CI Migration
# Source: .github/workflows/ci.yml
#
# No changes were necessary.

name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint and build
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec standardrb
      - run: gem build decent_job.gemspec
  specs:
    name: Specs (Ruby ${{ matrix.ruby }}, PostgreSQL ${{ matrix.postgres }})
    runs-on: depot-ubuntu-24.04-4
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']
        postgres: ['17']
        include:
          - ruby: '3.4'
            postgres: '14'
          - ruby: '3.4'
            postgres: '16'
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: decent_job_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DECENT_JOB_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/decent_job_test
      BUNDLE_WITHOUT: lint
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake spec
  pgbouncer:
    name: PgBouncer transaction pooling
    runs-on: depot-ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: decent_job_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DECENT_JOB_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/decent_job_test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: sudo apt-get update && sudo apt-get install -y pgbouncer
      - run: bundle exec rake spec:pgbouncer
  rails:
    name: Rails integration
    runs-on: depot-ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: decent_job_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DECENT_JOB_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/decent_job_test
      BUNDLE_GEMFILE: gemfiles/rails.gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rake spec:rails
