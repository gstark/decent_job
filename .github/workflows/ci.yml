name: CI

on: [push, pull_request]

jobs:
  specs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ['3.2', '3.4']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: decent_job_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DECENT_JOB_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/decent_job_test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake
      - run: bundle exec standardrb
      - run: gem build decent_job.gemspec
      - run: bundle install
        env:
          BUNDLE_GEMFILE: gemfiles/rails.gemfile
      - run: bundle exec rake spec:rails
        env:
          BUNDLE_GEMFILE: gemfiles/rails.gemfile
